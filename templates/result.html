<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Protected Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f1f1;
      padding: 20px;
    }
    nav {
      display: flex;
      justify-content: flex-end;
    }
    
    nav ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
    
    nav li {
      display: inline-block;
      margin-left: 10px;
    }
    
    nav a {
      text-decoration: none;
      color: #0093E9;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    p {
      text-align: center;
      font-size: 18px;
      color: #333;
    }

    .button-container {
      text-align: center;
      margin-top: 20px;
    }

    .button-container button {
      padding: 10px 20px;
      background-color: #0093E9;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .button-container button:hover {
      background-color: #0082cc;
    }
  </style>
</head>
<body>
    <nav>
        <ul>
          <li><a href="/first_page">Logout</a></li>
        </ul>
      </nav>
  <h2>Medical insurance cost prediction </h2>
  <p> prediction cost: {{ cost_pred }}</p>
  <div class="button-container">
    <button onclick="goBack()">Go Back</button>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
